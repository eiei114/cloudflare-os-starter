[package]
name = "cloudflare-os-tray"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
tray-icon = "=0.26.1"
tao = "=0.37.1"
serde_json = "1"
dirs = "6"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-foundation = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
